# Docker Compose — one command spins up the whole stack on any machine.
# NOTE: backend/ and frontend/ are scaffolded in Phase 0; their Dockerfiles
# don't exist yet, so `docker compose up` works fully only after Phase 0.

services:
  # --- PostgreSQL: the shared database both Laravel and Python talk to ---
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dataforge}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-app}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Laravel API (built in Phase 0) ---
  backend:
    build: ./backend
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - uploads:/var/www/html/storage/app/imports

  # --- Vue SPA dev server (built in Phase 0) ---
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

  # --- Python importer: separate worker that polls Postgres for pending jobs ---
  importer:
    build: ./importer
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./importer:/home/worker/app
      - uploads:/data/imports

volumes:
  pgdata:
  uploads:
