# Docker Compose — one command spins up the whole stack on any machine.

services:
  # --- PostgreSQL: the shared database both Laravel and Python talk to ---
  # pgvector/pgvector:pg16 is postgres:16 with the pgvector extension
  # precompiled -- customer_embeddings needs `CREATE EXTENSION vector`.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dataforge}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-app}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Python FastAPI import service ---
  python-service:
    build: ./python-service
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "${PYTHON_SERVICE_PORT:-8001}:8001"
    env_file: .env
    environment:
      BACKEND_STORAGE_PATH: /var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/storage/app:/var/www/html/storage/app:ro
      - ./python-service:/app

  # --- Laravel API (built in Phase 0) ---
  backend:
    build: ./backend
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file: .env
    environment:
      PYTHON_SERVICE_URL: http://python-service:8001
    depends_on:
      db:
        condition: service_healthy
      python-service:
        condition: service_started
      mailpit:
        condition: service_started
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor

  # --- Mailpit: dev mail catcher (SMTP :1025 in-network, web UI :8025) ---
  # Traps all outgoing mail so nothing reaches real inboxes; read it at :8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      # only the web UI is published; SMTP 1025 stays on the compose network
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # --- Vue SPA dev server (built in Phase 0) ---
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      # Browser-side base URL for the API. Must point at the host-published
      # backend port (APP_PORT), not the in-container 8000.
      VITE_API_URL: http://localhost:${APP_PORT:-8000}
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  pgdata:
